<label class="glass-switch">
  <input type="checkbox">
  <span class="bubble-slider"></span>
</label>

<style>
  .glass-switch {
    position: relative;
    display: inline-block;
    width: 100px;
    height: 54px;
  }

  .glass-switch input {
    opacity: 0; width: 0; height: 0;
  }

  .bubble-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 50px;
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    transition: all 0.5s ease;
  }

  .bubble-slider:before {
    position: absolute;
    content: "";
    height: 42px;
    width: 42px;
    left: 6px;
    bottom: 4.5px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(8px);
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 
      inset 0 4px 10px rgba(255, 255, 255, 0.5),
      0 4px 15px rgba(0, 0, 0, 0.1);
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  /* Efek Animasi Gelembung Saat Toggle */
  input:checked + .bubble-slider:before {
    transform: translateX(46px);
    animation: jelly 0.6s ease;
    background: rgba(255, 255, 255, 0.25);
  }

  input:not(:checked) + .bubble-slider:before {
    animation: jelly-rev 0.6s ease;
  }

  input:checked + .bubble-slider {
    background: rgba(48, 209, 88, 0.25);
    border-color: rgba(48, 209, 88, 0.3);
  }

  @keyframes jelly {
    0% { transform: translateX(0) scale(1, 1); }
    30% { transform: translateX(15px) scale(1.3, 0.7); }
    60% { transform: translateX(35px) scale(0.8, 1.2); }
    100% { transform: translateX(46px) scale(1, 1); }
  }

  @keyframes jelly-rev {
    0% { transform: translateX(46px) scale(1, 1); }
    30% { transform: translateX(31px) scale(1.3, 0.7); }
    60% { transform: translateX(11px) scale(0.8, 1.2); }
    100% { transform: translateX(0) scale(1, 1); }
  }

  .glass-switch:active .bubble-slider:before {
    width: 50px; /* Sedikit memanjang saat ditekan */
  }
</style>
