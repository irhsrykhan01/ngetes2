<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1a1a2e, #0a0a14);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* LIQUID CARD */
.box {
  width: 120px;
  height: 120px;
  border-radius: 30px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(25px);
  box-shadow:
    0 10px 40px rgba(0,0,0,0.5),
    inset 0 1px 2px rgba(255,255,255,0.2);

  position: relative;
}

/* DRAG BUTTON */
.knob {
  width: 40px;
  height: 40px;
  border-radius: 50%;

  background: linear-gradient(145deg,#fff,#dcdcdc);
  position: absolute;
  bottom: 10px;
  right: 10px;

  cursor: grab;
  transition: transform 0.2s ease;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<div class="box" id="box">
  <div class="knob" id="knob"></div>
</div>

<script>
const knob = document.getElementById("knob");
const box = document.getElementById("box");

let dragging = false;

knob.addEventListener("mousedown", () => dragging = true);
document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", (e) => {
  if (!dragging) return;

  const rect = box.getBoundingClientRect();

  let x = e.clientX - rect.left - 20;
  let y = e.clientY - rect.top - 20;

  // batas dalam box
  x = Math.max(0, Math.min(x, rect.width - 40));
  y = Math.max(0, Math.min(y, rect.height - 40));

  knob.style.left = x + "px";
  knob.style.top = y + "px";
});
</script>

</body>
</html>
