<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>⚡ FlashBot AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
flex-direction:column;
background:linear-gradient(135deg,#0f172a,#1e293b,#0b1220);
color:white;
overflow:hidden;
}

/* HEADER */
header{
padding:14px;
text-align:center;
font-size:18px;
font-weight:bold;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.1);
flex-shrink:0;
}

/* CHAT */
#chat{
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
}

/* MESSAGE */
.msg{
max-width:80%;
padding:10px 12px;
border-radius:14px;
word-wrap:break-word;
animation:pop .15s ease;
line-height:1.4;
font-size:14px;
}

@keyframes pop{
from{transform:scale(0.95);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.user{
align-self:flex-end;
background:rgba(37,99,235,0.35);
backdrop-filter:blur(10px);
}

.bot{
align-self:flex-start;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
}

/* INPUT AREA */
.bottom{
display:flex;
gap:8px;
padding:10px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border-top:1px solid rgba(255,255,255,0.1);
flex-shrink:0;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:12px;
outline:none;
background:rgba(255,255,255,0.08);
color:white;
font-size:14px;
}

button{
padding:12px 14px;
border:none;
border-radius:12px;
background:rgba(37,99,235,0.7);
color:white;
cursor:pointer;
font-size:14px;
transition:0.2s;
}

button:active{
transform:scale(0.95);
}

/* MOBILE FIX */
@media (max-width:600px){
.msg{
max-width:90%;
font-size:13px;
}
}

</style>
</head>

<body>

<header>⚡ FlashBot AI</header>

<div id="chat">
<div class="msg bot">Halo 👋 aku FlashBot AI!</div>
</div>

<div class="bottom">
<input id="input" placeholder="Tulis pesan...">
<button onclick="send()">Kirim</button>
</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");

const API_KEY = "AIzaSyA9kXWOQR_55ec3dC4YCu5pUBSy35UDIKA";

function addMsg(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.innerText=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
return div;
}

async function send(){

const text=input.value.trim();
if(!text) return;

addMsg(text,"user");
input.value="";

const loading = addMsg("⌨️ FlashBot sedang mengetik...","bot");

try{

const res = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{parts:[{text:text}]}
]
})
}
);

const data = await res.json();

loading.remove();

let reply = "Tidak ada jawaban.";

if(data.candidates?.[0]?.content?.parts?.[0]?.text){
reply = data.candidates[0].content.parts[0].text;
}
else if(data.error){
reply = "ERROR: " + data.error.message;
}

addMsg(reply,"bot");

}
catch(err){
loading.remove();
addMsg("❌ gagal koneksi ke Gemini","bot");
}

}

input.addEventListener("keypress",(e)=>{
if(e.key==="Enter") send();
});

</script>

</body>
</html>
