<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap');

        :root {
            --primary: #4ade80;
            --primary-dark: #166534;
            --bg-overlay: rgba(15, 23, 42, 0.7);
            --panel-bg: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-glow: 0 0 10px rgba(255,255,255,0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0f172a;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on mobile */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-overlay);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 85%;
        }

        .screen.active .panel {
            transform: scale(1);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            text-shadow: 2px 4px 0px var(--primary-dark);
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 { margin-bottom: 1rem; font-size: 2rem; }
        
        p { margin-bottom: 0.5rem; font-size: 1.1rem; }

        .btn {
            background: linear-gradient(135deg, var(--primary), #22c55e);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px;
            width: 80%;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .btn:active { transform: translateY(1px); }
        
        .btn-small { width: auto; font-size: 1rem; padding: 8px 16px; margin: 4px; }
        .btn-alt { background: linear-gradient(135deg, #64748b, #475569); box-shadow: 0 4px 15px rgba(100, 116, 139, 0.4); }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
            pointer-events: none;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 0 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            transition: transform 0.1s;
        }

        .score-glow {
            text-shadow: 0 0 20px #fff, 0 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            transform: scale(1.2);
        }

        #pause-btn-hud {
            pointer-events: auto;
            background: rgba(255,255,255,0.2);
            border: 2px solid #fff;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
            display: none; /* Hidden on menu */
        }

        /* Countdown */
        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            font-weight: 900;
            text-shadow: 4px 4px 0 #000;
            z-index: 8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* Medals */
        .medal-container {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.8rem;
            border: 4px solid rgba(255,255,255,0.3);
            background: #333;
        }
        
        .medal-bronze { background: linear-gradient(135deg, #cd7f32, #8b4513); box-shadow: 0 0 15px #cd7f32; }
        .medal-silver { background: linear-gradient(135deg, #e5e4e2, #a9a9a9); box-shadow: 0 0 15px #e5e4e2; }
        .medal-gold { background: linear-gradient(135deg, #ffd700, #b8860b); box-shadow: 0 0 20px #ffd700; }
        .medal-platinum { background: linear-gradient(135deg, #e5e4e2, #00ced1); box-shadow: 0 0 25px #00ced1; border-color: #fff; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }
        .stats-grid div { font-size: 0.9rem; }
        .stats-grid span { font-weight: bold; font-size: 1.2rem; display: block; color: var(--primary); }

        /* Settings UI */
        .slider-container { margin: 15px 0; text-align: left; }
        input[type=range] { width: 100%; accent-color: var(--primary); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div id="score" class="score-display">0</div>
        <button id="pause-btn-hud">||</button>
    </div>

    <div id="countdown">3</div>

    <div id="menu-screen" class="screen active">
        <div class="panel">
            <h1>FLAPPY<br>PRO</h1>
            <p id="menu-best-score">Best: 0</p>
            <button class="btn" id="start-btn">Start Game</button>
            <button class="btn btn-alt" id="settings-btn">Settings</button>
            <div style="margin-top: 15px;">
                <button class="btn btn-alt btn-small" id="help-btn">How to Play</button>
                <button class="btn btn-alt btn-small" id="stats-btn">Stats</button>
            </div>
        </div>
    </div>

    <div id="game-over-screen" class="screen">
        <div class="panel">
            <h2>Game Over</h2>
            <div id="medal-display" class="medal-container">None</div>
            <div class="stats-grid">
                <div>Score<span id="go-score">0</span></div>
                <div>Best<span id="go-best">0</span></div>
            </div>
            <button class="btn" id="restart-btn">Play Again</button>
            <button class="btn btn-alt" id="menu-return-btn">Main Menu</button>
        </div>
    </div>

    <div id="pause-screen" class="screen">
        <div class="panel">
            <h2>Paused</h2>
            <button class="btn" id="resume-btn">Resume</button>
            <button class="btn btn-alt" id="pause-menu-btn">Main Menu</button>
        </div>
    </div>

    <div id="settings-screen" class="screen">
        <div class="panel">
            <h2>Settings</h2>
            <div class="slider-container">
                <label>Master Volume: <span id="vol-value">100%</span></label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
            </div>
            <button class="btn btn-alt" id="mute-btn">Mute: OFF</button>
            <button class="btn btn-alt" style="background:#ef4444;" id="reset-data-btn">Reset Data</button>
            <button class="btn" id="close-settings-btn">Back</button>
        </div>
    </div>

    <div id="info-screen" class="screen">
        <div class="panel">
            <h2 id="info-title">Stats</h2>
            <div id="info-content" style="text-align: left; margin-bottom: 20px; font-size: 0.9rem;">
                </div>
            <button class="btn" id="close-info-btn">Back</button>
        </div>
    </div>
</div>

<script>
/**
 * Flappy Pro - Modern HTML5 Canvas Game
 * ES6 Architecture, Web Audio API, Object Pooling.
 */

// ==========================================
// 1. SOUND MANAGER (Web Audio API)
// ==========================================
class SoundManager {
    constructor() {
        this.ctx = null;
        this.masterVolume = 1.0;
        this.isMuted = false;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            this.ctx = new AudioContext();
            this.initialized = true;
        }
    }

    playTone(freq, type, duration, volSlide = false) {
        if (!this.initialized || this.isMuted) return;
        
        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        
        gainNode.gain.setValueAtTime(this.masterVolume * 0.1, this.ctx.currentTime);
        if (volSlide) {
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        } else {
            gainNode.gain.setValueAtTime(0, this.ctx.currentTime + duration);
        }

        osc.connect(gainNode);
        gainNode.connect(this.ctx.destination);
        
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    playFlap() {
        if(!this.initialized || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(this.masterVolume * 0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }

    playScore() {
        if(!this.initialized || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1200, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(this.masterVolume * 0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playHit() {
        if(!this.initialized || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(this.masterVolume * 0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }

    setVolume(val) { this.masterVolume = val; }
    toggleMute() { this.isMuted = !this.isMuted; return this.isMuted; }
}

// ==========================================
// 2. PARTICLES & OBJECT POOLING
// ==========================================
class Particle {
    constructor() {
        this.active = false;
    }
    spawn(x, y, vx, vy, color, life, size) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = size;
        this.active = true;
    }
    update() {
        if (!this.active) return;
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        if (this.life <= 0) this.active = false;
    }
    draw(ctx) {
        if (!this.active) return;
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class ParticleSystem {
    constructor(size) {
        this.pool = Array.from({ length: size }, () => new Particle());
    }
    emit(x, y, count, color, speedBase, sizeBase) {
        for (let i = 0; i < count; i++) {
            const p = this.pool.find(p => !p.active);
            if (p) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * speedBase;
                p.spawn(x, y, Math.cos(angle)*speed, Math.sin(angle)*speed, color, 20 + Math.random()*20, Math.random()*sizeBase + 2);
            }
        }
    }
    updateAndDraw(ctx) {
        for (let i = 0; i < this.pool.length; i++) {
            if (this.pool[i].active) {
                this.pool[i].update();
                this.pool[i].draw(ctx);
            }
        }
    }
}

// ==========================================
// 3. GAME ENTITIES (Bird, Pipe, Background)
// ==========================================
class Bird {
    constructor(x, y) {
        this.startX = x;
        this.startY = y;
        this.x = x;
        this.y = y;
        this.radius = 15;
        this.velocity = 0;
        this.gravity = 0.25;
        this.jumpStrength = -6.5;
        this.rotation = 0;
        this.flapAnim = 0;
        this.color = '#fbbf24'; // Yellow
    }

    jump() {
        this.velocity = this.jumpStrength;
    }

    update() {
        this.velocity += this.gravity;
        this.y += this.velocity;
        
        // Calculate rotation based on velocity
        this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.1)));
        
        // Flap animation
        this.flapAnim += 0.2;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#b45309';
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(8, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(10, 2);
        ctx.lineTo(22, 5);
        ctx.lineTo(10, 8);
        ctx.fill();
        ctx.stroke();

        // Wing
        const wingY = Math.sin(this.flapAnim) * 5;
        ctx.fillStyle = '#fcd34d';
        ctx.beginPath();
        ctx.ellipse(-4, 2 + wingY, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.velocity = 0;
        this.rotation = 0;
    }
}

class Pipe {
    constructor(x, canvasHeight, gapSize, speed) {
        this.x = x;
        this.width = 60;
        this.gap = gapSize;
        this.speed = speed;
        this.passed = false;

        // Ground is ~100px. Calculate safe top pipe height.
        const minHeight = 50;
        const maxHeight = canvasHeight - 100 - this.gap - minHeight;
        this.topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1) + minHeight);
        this.bottomY = this.topHeight + this.gap;
    }

    update(speedMultiplier) {
        this.x -= this.speed * speedMultiplier;
    }

    draw(ctx, canvasHeight) {
        // Draw Top Pipe
        this._drawPipeBody(ctx, this.x, 0, this.width, this.topHeight, true);
        // Draw Bottom Pipe
        this._drawPipeBody(ctx, this.x, this.bottomY, this.width, canvasHeight - this.bottomY, false);
    }

    _drawPipeBody(ctx, px, py, pw, ph, isTop) {
        const capHeight = 20;
        const capOverhang = 4;
        
        // Gradient for 3D effect
        const grad = ctx.createLinearGradient(px, 0, px + pw, 0);
        grad.addColorStop(0, '#22c55e');
        grad.addColorStop(0.5, '#4ade80');
        grad.addColorStop(1, '#166534');

        ctx.fillStyle = grad;
        ctx.strokeStyle = '#052e16';
        ctx.lineWidth = 2;

        // Main body
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeRect(px, py, pw, ph);

        // Cap
        const capY = isTop ? py + ph - capHeight : py;
        ctx.fillRect(px - capOverhang, capY, pw + (capOverhang*2), capHeight);
        ctx.strokeRect(px - capOverhang, capY, pw + (capOverhang*2), capHeight);
    }

    checkCollision(bird) {
        // Circle-Rectangle Collision logic
        const hitTop = this._rectCircleColliding(
            bird, 
            {x: this.x, y: 0, w: this.width, h: this.topHeight}
        );
        const hitBottom = this._rectCircleColliding(
            bird, 
            {x: this.x, y: this.bottomY, w: this.width, h: 9999}
        );
        return hitTop || hitBottom;
    }

    _rectCircleColliding(circle, rect) {
        const distX = Math.abs(circle.x - rect.x - rect.w / 2);
        const distY = Math.abs(circle.y - rect.y - rect.h / 2);

        if (distX > (rect.w / 2 + circle.radius)) return false;
        if (distY > (rect.h / 2 + circle.radius)) return false;

        if (distX <= (rect.w / 2)) return true;
        if (distY <= (rect.h / 2)) return true;

        const dx = distX - rect.w / 2;
        const dy = distY - rect.h / 2;
        return (dx * dx + dy * dy <= (circle.radius * circle.radius));
    }
}

class Background {
    constructor(canvas) {
        this.canvas = canvas;
        this.clouds = [];
        this.bgOffset = 0;
        this.groundOffset = 0;
        
        // Generate static clouds
        for(let i=0; i<5; i++) {
            this.clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height / 2),
                size: Math.random() * 30 + 20,
                speed: Math.random() * 0.5 + 0.1
            });
        }
    }

    update(speedMultiplier) {
        this.bgOffset -= 0.5 * speedMultiplier;
        if(this.bgOffset <= -this.canvas.width) this.bgOffset = 0;
        
        this.groundOffset -= 3 * speedMultiplier;
        if(this.groundOffset <= -30) this.groundOffset = 0;

        this.clouds.forEach(c => {
            c.x -= c.speed * speedMultiplier;
            if(c.x < -100) {
                c.x = this.canvas.width + 50;
                c.y = Math.random() * (this.canvas.height / 2);
            }
        });
    }

    draw(ctx) {
        // Sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, this.canvas.height);
        skyGrad.addColorStop(0, '#38bdf8'); // Light blue
        skyGrad.addColorStop(1, '#bae6fd');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        this.clouds.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
            ctx.arc(c.x + c.size*0.8, c.y - c.size*0.3, c.size*0.8, 0, Math.PI*2);
            ctx.arc(c.x + c.size*1.2, c.y, c.size*0.9, 0, Math.PI*2);
            ctx.fill();
        });

        // City silhouette (Parallax)
        ctx.fillStyle = '#94a3b8';
        const cityWidth = 100;
        for(let i=0; i<Math.ceil(this.canvas.width/cityWidth)+2; i++) {
            const x = (i * cityWidth) + (this.bgOffset % cityWidth);
            ctx.fillRect(x, this.canvas.height - 180, 40, 80);
            ctx.fillRect(x + 45, this.canvas.height - 220, 50, 120);
        }
    }

    drawGround(ctx) {
        const groundY = this.canvas.height - 100;
        
        // Base ground
        ctx.fillStyle = '#d97706';
        ctx.fillRect(0, groundY, this.canvas.width, 100);
        
        // Grass top
        ctx.fillStyle = '#65a30d';
        ctx.fillRect(0, groundY, this.canvas.width, 20);

        // Ground stripes for movement illusion
        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for(let i = 0; i < this.canvas.width + 30; i += 30) {
            ctx.moveTo(i + this.groundOffset, groundY + 20);
            ctx.lineTo(i - 20 + this.groundOffset, this.canvas.height);
        }
        ctx.stroke();
    }
}

// ==========================================
// 4. UI AND STATE MANAGER
// ==========================================
class UIManager {
    constructor(game) {
        this.game = game;
        this.screens = {
            menu: document.getElementById('menu-screen'),
            gameover: document.getElementById('game-over-screen'),
            pause: document.getElementById('pause-screen'),
            settings: document.getElementById('settings-screen'),
            info: document.getElementById('info-screen')
        };
        this.hudScore = document.getElementById('score');
        this.countdownTxt = document.getElementById('countdown');
        this.pauseBtnHud = document.getElementById('pause-btn-hud');
        
        this.bindEvents();
        this.updateMenuBest();
    }

    showScreen(screenName) {
        Object.values(this.screens).forEach(s => s.classList.remove('active'));
        if (screenName && this.screens[screenName]) {
            this.screens[screenName].classList.add('active');
        }
        this.pauseBtnHud.style.display = (screenName === null || screenName === 'countdown') ? 'flex' : 'none';
    }

    updateScore(score, animate = false) {
        this.hudScore.innerText = score;
        if (animate) {
            this.hudScore.classList.add('score-glow');
            setTimeout(() => this.hudScore.classList.remove('score-glow'), 150);
        }
    }

    showGameOver(score, bestScore) {
        document.getElementById('go-score').innerText = score;
        document.getElementById('go-best').innerText = bestScore;
        
        const medalDisplay = document.getElementById('medal-display');
        medalDisplay.className = 'medal-container'; // Reset
        
        if (score >= 40) { medalDisplay.innerText = "PLAT"; medalDisplay.classList.add('medal-platinum'); }
        else if (score >= 30) { medalDisplay.innerText = "GOLD"; medalDisplay.classList.add('medal-gold'); }
        else if (score >= 20) { medalDisplay.innerText = "SILVER"; medalDisplay.classList.add('medal-silver'); }
        else if (score >= 10) { medalDisplay.innerText = "BRONZE"; medalDisplay.classList.add('medal-bronze'); }
        else { medalDisplay.innerText = "NONE"; }

        this.showScreen('gameover');
    }

    updateMenuBest() {
        document.getElementById('menu-best-score').innerText = `Best: ${this.game.storage.bestScore}`;
    }

    startCountdown(callback) {
        this.showScreen(null); // Hide screens
        let count = 3;
        this.countdownTxt.style.opacity = 1;
        this.countdownTxt.innerText = count;
        
        const int = setInterval(() => {
            count--;
            if (count > 0) {
                this.countdownTxt.innerText = count;
            } else if (count === 0) {
                this.countdownTxt.innerText = "GO!";
            } else {
                clearInterval(int);
                this.countdownTxt.style.opacity = 0;
                callback();
            }
        }, 800);
    }

    bindEvents() {
        // Main Menu
        document.getElementById('start-btn').addEventListener('click', () => this.game.initSequence());
        document.getElementById('settings-btn').addEventListener('click', () => this.showScreen('settings'));
        
        // Help & Stats
        document.getElementById('help-btn').addEventListener('click', () => {
            document.getElementById('info-title').innerText = "How to Play";
            document.getElementById('info-content').innerHTML = "<ul><li>Tap, Click, or press Spacebar to fly.</li><li>Avoid the green pipes.</li><li>Don't hit the ground.</li><li>Collect points to increase speed!</li></ul>";
            this.showScreen('info');
        });
        document.getElementById('stats-btn').addEventListener('click', () => {
            document.getElementById('info-title').innerText = "Statistics";
            document.getElementById('info-content').innerHTML = `
                <p>Best Score: <b>${this.game.storage.bestScore}</b></p>
                <p>Total Games Played: <b>${this.game.storage.gamesPlayed}</b></p>
                <p>Total Pipes Passed: <b>${this.game.storage.totalPipes}</b></p>
            `;
            this.showScreen('info');
        });
        document.getElementById('close-info-btn').addEventListener('click', () => this.showScreen('menu'));

        // Settings
        const volSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');
        volSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            this.game.sound.setVolume(val);
            document.getElementById('vol-value').innerText = Math.round(val * 100) + '%';
        });
        muteBtn.addEventListener('click', () => {
            const isMuted = this.game.sound.toggleMute();
            muteBtn.innerText = isMuted ? "Mute: ON" : "Mute: OFF";
        });
        document.getElementById('reset-data-btn').addEventListener('click', () => {
            if(confirm("Are you sure you want to reset all progress?")) {
                this.game.resetStorage();
                this.updateMenuBest();
                alert("Data reset successfully.");
            }
        });
        document.getElementById('close-settings-btn').addEventListener('click', () => this.showScreen('menu'));

        // Game Over & Pause
        document.getElementById('restart-btn').addEventListener('click', () => this.game.initSequence());
        document.getElementById('menu-return-btn').addEventListener('click', () => { this.game.reset(); this.showScreen('menu'); });
        
        this.pauseBtnHud.addEventListener('click', () => this.game.togglePause());
        document.getElementById('resume-btn').addEventListener('click', () => this.game.togglePause());
        document.getElementById('pause-menu-btn').addEventListener('click', () => { this.game.reset(); this.showScreen('menu'); });
    }
}

// ==========================================
// 5. MAIN GAME ENGINE
// ==========================================
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base canvas
        
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // Systems
        this.sound = new SoundManager();
        this.particles = new ParticleSystem(50);
        this.bg = new Background(this.canvas);
        this.ui = new UIManager(this);

        // Storage setup
        this.storage = {
            bestScore: parseInt(localStorage.getItem('flappyPro_best')) || 0,
            gamesPlayed: parseInt(localStorage.getItem('flappyPro_plays')) || 0,
            totalPipes: parseInt(localStorage.getItem('flappyPro_pipes')) || 0
        };

        // Entities & State
        this.bird = new Bird(this.canvas.width * 0.3, this.canvas.height * 0.5);
        this.pipes = [];
        this.score = 0;
        
        // State Machine: 'menu', 'countdown', 'playing', 'paused', 'gameover'
        this.state = 'menu';
        
        // Difficulty/Timing
        this.frames = 0;
        this.pipeSpawnRate = 120; // Frames between spawns
        this.baseSpeed = 3;
        this.speedMultiplier = 1;
        this.shakeTime = 0;

        // Input Setup
        this.setupInputs();

        // Start Loop
        this.lastTime = 0;
        requestAnimationFrame((t) => this.loop(t));
    }

    resize() {
        const container = document.getElementById('game-container');
        this.canvas.width = container.clientWidth;
        this.canvas.height = container.clientHeight;
    }

    setupInputs() {
        const handleInput = (e) => {
            if (e.type !== 'touchstart') {
                if (e.code && e.code !== 'Space' && e.type === 'keydown') return;
            }
            if (e.type === 'keydown') e.preventDefault(); // Prevent scrolling with space

            // Init audio context on first user interaction
            this.sound.init();

            if (this.state === 'playing') {
                this.bird.jump();
                this.sound.playFlap();
                this.particles.emit(this.bird.x, this.bird.y + 10, 3, '#ffffff', 2, 3);
            }
        };

        window.addEventListener('keydown', handleInput);
        this.canvas.addEventListener('mousedown', handleInput);
        this.canvas.addEventListener('touchstart', handleInput, {passive: false});
    }

    saveStorage() {
        localStorage.setItem('flappyPro_best', this.storage.bestScore);
        localStorage.setItem('flappyPro_plays', this.storage.gamesPlayed);
        localStorage.setItem('flappyPro_pipes', this.storage.totalPipes);
    }

    resetStorage() {
        this.storage = { bestScore: 0, gamesPlayed: 0, totalPipes: 0 };
        this.saveStorage();
    }

    initSequence() {
        this.sound.init();
        this.reset();
        this.state = 'countdown';
        this.ui.startCountdown(() => {
            this.state = 'playing';
            this.storage.gamesPlayed++;
            this.saveStorage();
            this.bird.jump();
        });
    }

    reset() {
        this.bird.reset();
        this.bird.y = this.canvas.height * 0.5;
        this.pipes = [];
        this.score = 0;
        this.frames = 0;
        this.speedMultiplier = 1;
        this.ui.updateScore(0);
        this.bg.groundOffset = 0;
    }

    togglePause() {
        if (this.state === 'playing') {
            this.state = 'paused';
            this.ui.showScreen('pause');
        } else if (this.state === 'paused') {
            this.state = 'playing';
            this.ui.showScreen(null);
        }
    }

    gameOver() {
        this.state = 'gameover';
        this.shakeTime = 15;
        this.sound.playHit();
        this.particles.emit(this.bird.x, this.bird.y, 20, this.bird.color, 5, 5);
        
        if (this.score > this.storage.bestScore) {
            this.storage.bestScore = this.score;
        }
        this.saveStorage();
        this.ui.updateMenuBest();
        
        setTimeout(() => {
            this.ui.showGameOver(this.score, this.storage.bestScore);
        }, 500); // Small delay before showing UI
    }

    update() {
        if (this.state === 'menu' || this.state === 'paused') {
            // Just idle animations
            this.bg.update(0.2);
            return;
        }

        if (this.state === 'countdown') {
            this.bg.update(0.5);
            // Bobbing bird
            this.bird.y = (this.canvas.height * 0.5) + Math.sin(Date.now() / 200) * 10;
            return;
        }

        if (this.state === 'gameover') {
            // Bird falls down
            if (this.bird.y < this.canvas.height - 100) {
                this.bird.velocity += this.bird.gravity * 1.5;
                this.bird.y += this.bird.velocity;
                this.bird.rotation += 0.1;
            }
            if (this.shakeTime > 0) this.shakeTime--;
            return;
        }

        // --- PLAYING STATE ---
        this.frames++;
        
        // Progressive Difficulty
        this.speedMultiplier = 1 + (this.score * 0.02); // Speed up slightly per score
        const currentSpeed = this.baseSpeed * this.speedMultiplier;
        
        // Decrease gap slightly over time, minimum 110px
        const currentGap = Math.max(110, 160 - (this.score * 1.5));

        this.bg.update(this.speedMultiplier);
        this.bird.update();

        // Pipe Spawning
        const spawnRateAdj = Math.max(70, Math.floor(this.pipeSpawnRate / this.speedMultiplier));
        if (this.frames % spawnRateAdj === 0) {
            this.pipes.push(new Pipe(this.canvas.width, this.canvas.height, currentGap, this.baseSpeed));
        }

        // Pipe Logic
        for (let i = this.pipes.length - 1; i >= 0; i--) {
            let p = this.pipes[i];
            p.update(this.speedMultiplier);

            // Collision
            if (p.checkCollision(this.bird)) {
                this.gameOver();
            }

            // Scoring
            if (!p.passed && p.x + p.width < this.bird.x) {
                p.passed = true;
                this.score++;
                this.storage.totalPipes++;
                this.ui.updateScore(this.score, true);
                this.sound.playScore();
                this.particles.emit(this.bird.x, this.bird.y, 5, '#fef08a', 2, 2);
            }

            // Object Pool/Removal
            if (p.x + p.width < 0) {
                this.pipes.splice(i, 1);
            }
        }

        // Floor/Ceiling Collision
        if (this.bird.y + this.bird.radius >= this.canvas.height - 100 || this.bird.y - this.bird.radius <= 0) {
            this.gameOver();
        }
    }

    draw() {
        this.ctx.save();
        
        // Screen Shake effect
        if (this.shakeTime > 0) {
            const dx = (Math.random() - 0.5) * 10;
            const dy = (Math.random() - 0.5) * 10;
            this.ctx.translate(dx, dy);
        }

        // Draw Layers
        this.bg.draw(this.ctx);
        this.pipes.forEach(p => p.draw(this.ctx, this.canvas.height));
        this.bg.drawGround(this.ctx);
        this.particles.updateAndDraw(this.ctx);
        
        // Don't draw bird if it's menu
        if (this.state !== 'menu') {
            this.bird.draw(this.ctx);
        }

        this.ctx.restore();
    }

    loop(timestamp) {
        // Delta time could be used here for smoother physics, 
        // but fixed timestep via requestAnimationFrame is sufficient for this scope.
        this.update();
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

// ==========================================
// 6. INITIALIZATION
// ==========================================
window.onload = () => {
    const game = new Game();
};
</script>
