<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>iOS Glass Toggle</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #1e1e2f, #0c0c14);
  font-family: sans-serif;
}

/* Glass container */
.glass {
  padding: 40px;
  border-radius: 25px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.08);
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.4),
    inset 0 1px 1px rgba(255,255,255,0.2);
}

/* Toggle */
.toggle {
  position: relative;
  width: 70px;
  height: 40px;
}

.toggle input {
  display: none;
}

/* Track */
.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  border-radius: 50px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}

/* Knob */
.slider::before {
  content: "";
  position: absolute;
  height: 32px;
  width: 32px;
  left: 4px;
  top: 4px;
  border-radius: 50%;
  background: linear-gradient(145deg, #ffffff, #dcdcdc);
  box-shadow:
    0 4px 10px rgba(0,0,0,0.4),
    inset 0 2px 4px rgba(255,255,255,0.6);
  transition: all 0.4s cubic-bezier(0.25, 1.5, 0.5, 1);
}

/* ON state */
input:checked + .slider {
  background: linear-gradient(135deg, #4cd964, #2ecc71);
}

input:checked + .slider::before {
  transform: translateX(30px);
}

/* glow effect */
input:checked + .slider {
  box-shadow:
    0 0 15px rgba(76,217,100,0.7),
    inset 0 2px 6px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<div class="glass">
  <label class="toggle">
    <input type="checkbox">
    <span class="slider"></span>
  </label>
</div>

</body>
</html>
