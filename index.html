<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iOS Glass UI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #1a1a2e, #0a0a14);
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  color: white;
}

/* Glass Card */
.card {
  padding: 30px;
  border-radius: 30px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(25px);
  box-shadow:
    0 10px 40px rgba(0,0,0,0.5),
    inset 0 1px 1px rgba(255,255,255,0.2);
  width: 260px;
}

/* ================= TOGGLE ================= */
.toggle {
  position: relative;
  width: 60px;
  height: 34px;
  margin-bottom: 30px;
}

.toggle input {
  display: none;
}

.slider-toggle {
  position: absolute;
  inset: 0;
  border-radius: 50px;
  background: rgba(255,255,255,0.15);
  transition: 0.4s;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}

.slider-toggle::before {
  content: "";
  position: absolute;
  width: 28px;
  height: 28px;
  left: 3px;
  top: 3px;
  border-radius: 50%;
  background: linear-gradient(145deg, #fff, #dcdcdc);
  transition: 0.4s cubic-bezier(0.25,1.5,0.5,1);
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.toggle input:checked + .slider-toggle {
  background: linear-gradient(135deg, #4cd964, #2ecc71);
  box-shadow: 0 0 15px rgba(76,217,100,0.7);
}

.toggle input:checked + .slider-toggle::before {
  transform: translateX(26px);
}

/* ================= VOLUME SLIDER ================= */
.range-container {
  margin-top: 10px;
}

.range {
  -webkit-appearance: none;
  width: 100%;
  height: 10px;
  border-radius: 50px;
  background: rgba(255,255,255,0.15);
  outline: none;
  backdrop-filter: blur(10px);
}

/* track fill (fake iOS feel) */
.range::-webkit-slider-runnable-track {
  height: 10px;
  border-radius: 50px;
}

.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: linear-gradient(145deg, #fff, #dcdcdc);
  cursor: pointer;
  margin-top: -6px;
  transition: 0.2s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.range::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

.value {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="card">
  <div>Power</div>
  <label class="toggle">
    <input type="checkbox" id="power">
    <span class="slider-toggle"></span>
  </label>

  <div>Volume</div>
  <div class="range-container">
    <input type="range" min="0" max="100" value="50" class="range" id="volume">
    <div class="value">50%</div>
  </div>
</div>

<script>
const slider = document.getElementById("volume");
const value = document.querySelector(".value");

slider.addEventListener("input", () => {
  value.textContent = slider.value + "%";
});
</script>

</body>
</html>
