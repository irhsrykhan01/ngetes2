<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>⚡ FlashBot AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#1e293b;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
max-width:80%;
padding:12px;
border-radius:15px;
margin:8px 0;
word-wrap:break-word;
}

.user{
background:#2563eb;
color:white;
margin-left:auto;
}

.bot{
background:#1e293b;
color:white;
}

.bottom{
display:flex;
gap:10px;
padding:15px;
background:#111827;
}

input{
flex:1;
padding:12px;
border:none;
border-radius:12px;
background:#1e293b;
color:white;
outline:none;
}

button{
padding:12px 18px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
}
</style>
</head>

<body>

<header>⚡ FlashBot AI</header>

<div id="chat">
<div class="msg bot">Halo! Aku FlashBot 🚀</div>
</div>

<div class="bottom">
<input id="input" placeholder="Tulis pesan...">
<button onclick="send()">Kirim</button>
</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");

// 🔑 MASUKKAN API KEY OPENROUTER KAMU DI SINI
const API_KEY = "AIzaSyA9kXWOQR_55ec3dC4YCu5pUBSy35UDIKA";

async function send(){

const text=input.value.trim();
if(!text) return;

chat.innerHTML += `<div class="msg user">${text}</div>`;
input.value="";

chat.innerHTML += `<div class="msg bot" id="loading">⌨️ FlashBot sedang mengetik...</div>`;
chat.scrollTop=chat.scrollHeight;

try{

const res = await fetch("https://openrouter.ai/api/v1/chat/completions",{
method:"POST",
headers:{
"Authorization":"Bearer "+API_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
model:"meta-llama/llama-3.1-8b-instruct:free",
messages:[
{role:"system",content:"Kamu adalah FlashBot AI yang pintar, ramah, dan cepat menjawab."},
{role:"user",content:text}
]
})
});

const data = await res.json();

document.getElementById("loading").remove();

const reply = data.choices?.[0]?.message?.content || "Tidak ada jawaban.";

chat.innerHTML += `<div class="msg bot">${reply}</div>`;

}
catch(err){

document.getElementById("loading").remove();

chat.innerHTML += `<div class="msg bot">❌ Error koneksi ke OpenRouter.</div>`;

}

chat.scrollTop=chat.scrollHeight;
}

input.addEventListener("keypress",e=>{
if(e.key==="Enter"){
send();
}
});

</script>

</body>
</html>
