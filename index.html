<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Glass UI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* BACKGROUND LEBIH TERANG BIAR GLASS KELIATAN */
  background: linear-gradient(135deg, #2a2a40, #0f172a);
  font-family: sans-serif;
  color: white;
}

/* CARD LEBIH KECIL */
.card {
  padding: 20px;
  border-radius: 20px;
  width: 200px;

  /* GLASS YANG LEBIH KELIATAN */
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(20px);
  box-shadow:
    0 8px 25px rgba(0,0,0,0.4),
    inset 0 1px 1px rgba(255,255,255,0.3);
}

/* TOGGLE */
.toggle {
  position: relative;
  width: 50px;
  height: 28px;
  margin: 10px 0 20px;
}

.toggle input {
  display: none;
}

.slider-toggle {
  position: absolute;
  inset: 0;
  border-radius: 50px;
  background: rgba(255,255,255,0.25);
  transition: 0.3s;
}

.slider-toggle::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  top: 3px;
  border-radius: 50%;
  background: white;
  transition: 0.3s;
}

.toggle input:checked + .slider-toggle {
  background: #4cd964;
}

.toggle input:checked + .slider-toggle::before {
  transform: translateX(22px);
}

/* SLIDER */
.range {
  width: 100%;
}

.value {
  font-size: 13px;
  margin-top: 5px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="card">
  <div>Power</div>
  <label class="toggle">
    <input type="checkbox">
    <span class="slider-toggle"></span>
  </label>

  <div>Volume</div>
  <input type="range" min="0" max="100" value="50" class="range" id="vol">
  <div class="value" id="val">50%</div>
</div>

<script>
const v = document.getElementById("vol");
const val = document.getElementById("val");

v.oninput = () => {
  val.textContent = v.value + "%";
};
</script>

</body>
</html>
