<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* BACKGROUND TERANG */
  background: linear-gradient(135deg, #89f7fe, #66a6ff);
  font-family: sans-serif;
}

/* CONTAINER AUTO RESPONSIVE */
.wrapper {
  width: 90vw;
  max-width: 320px;
}

/* GLASS PILL */
.glass {
  backdrop-filter: blur(25px);
  background: rgba(255,255,255,0.25);
  border-radius: 30px;
  padding: 15px;
  box-shadow:
    0 10px 30px rgba(0,0,0,0.15),
    inset 0 1px 2px rgba(255,255,255,0.4);
}

/* ================= TOGGLE ================= */
.toggle {
  position: relative;
  width: 50px;
  height: 28px;
  margin-bottom: 20px;
}

.toggle input {
  display: none;
}

.track {
  position: absolute;
  inset: 0;
  border-radius: 50px;
  background: rgba(255,255,255,0.5);
  transition: 0.3s;
}

.track::before {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  top: 3px;
  left: 3px;
  border-radius: 50%;
  background: white;
  transition: 0.3s cubic-bezier(0.25,1.5,0.5,1);
}

.toggle input:checked + .track {
  background: #4cd964;
}

.toggle input:checked + .track::before {
  transform: translateX(22px);
}

/* ================= SLIDER ================= */
.slider-wrap {
  position: relative;
  height: 30px;
}

.range {
  -webkit-appearance: none;
  width: 100%;
  height: 30px;
  background: transparent;
  position: absolute;
  z-index: 2;
}

/* TRACK GLASS */
.track-bg {
  position: absolute;
  inset: 0;
  border-radius: 50px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(10px);
}

/* THUMB */
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: 0.2s;
}

.range::-webkit-slider-thumb:active {
  transform: scale(1.2);
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="glass">

    <!-- TOGGLE -->
    <label class="toggle">
      <input type="checkbox">
      <span class="track"></span>
    </label>

    <!-- SLIDER -->
    <div class="slider-wrap">
      <div class="track-bg"></div>
      <input type="range" min="0" max="100" value="50" class="range">
    </div>

  </div>
</div>

</body>
</html>
