<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Rashii</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f0f2f5;
    margin:0;
}

header{
    background:#00a884;
    color:white;
    text-align:center;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}

#chat{
    height:75vh;
    overflow-y:auto;
    padding:10px;
}

.msg{
    padding:10px 15px;
    border-radius:12px;
    margin:8px 0;
    max-width:80%;
}

.user{
    background:#dcf8c6;
    margin-left:auto;
}

.ai{
    background:white;
}

.bottom{
    display:flex;
    padding:10px;
    background:white;
}

input{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    margin-left:8px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#00a884;
    color:white;
    font-weight:bold;
}
</style>
</head>
<body>

<header>🤖 AI Rashii</header>

<div id="chat">
    <div class="msg ai">
        Halo! Aku AI Rashii. Tanya apa saja 😎
    </div>
</div>

<div class="bottom">
    <input id="input" placeholder="Ketik pesan...">
    <button onclick="kirim()">Kirim</button>
</div>

<script>
function tambah(teks, tipe){
    let div = document.createElement("div");
    div.className = "msg " + tipe;
    div.textContent = teks;

    document.getElementById("chat").appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function jawabAI(pesan){

    pesan = pesan.toLowerCase();

    if(pesan.includes("halo"))
        return "Halo juga! 👋";

    if(pesan.includes("nama"))
        return "Namaku AI Rashii 😎";

    if(pesan.includes("siapa kamu"))
        return "Aku chatbot buatan Rashii.";

    if(pesan.includes("youtube"))
        return "Semangat ngonten YouTube ya!";

    if(pesan.includes("game"))
        return "Aku juga suka bahas game 🎮";

    if(pesan.includes("terima kasih"))
        return "Sama-sama 😄";

    let random = [
        "Menarik juga 🤔",
        "Coba ceritakan lebih lanjut.",
        "Aku masih belajar nih 🗿",
        "Bisa jelaskan lebih detail?",
        "Wah keren!"
    ];

    return random[Math.floor(Math.random()*random.length)];
}

function kirim(){

    let input = document.getElementById("input");
    let pesan = input.value.trim();

    if(!pesan) return;

    tambah(pesan,"user");

    setTimeout(()=>{
        tambah(jawabAI(pesan),"ai");
    },500);

    input.value="";
}

document.getElementById("input")
.addEventListener("keypress",function(e){
    if(e.key==="Enter") kirim();
});
</script>

</body>
</html>
