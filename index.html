<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>⚡ FlashBot AI (Gemini)</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#0b1220);
color:white;
overflow:hidden;
}

header{
padding:16px;
text-align:center;
font-size:20px;
font-weight:bold;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.1);
}

#chat{
flex:1;
padding:15px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:75%;
padding:12px 14px;
border-radius:18px;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
animation:pop .2s ease;
}

@keyframes pop{
from{transform:scale(0.95);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.user{
align-self:flex-end;
background:rgba(37,99,235,0.35);
}

.bot{
align-self:flex-start;
background:rgba(255,255,255,0.08);
}

.bottom{
display:flex;
gap:10px;
padding:12px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border-top:1px solid rgba(255,255,255,0.1);
}

input{
flex:1;
padding:12px;
border:none;
border-radius:14px;
outline:none;
background:rgba(255,255,255,0.08);
color:white;
}

button{
padding:12px 16px;
border:none;
border-radius:14px;
background:rgba(37,99,235,0.6);
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}
</style>
</head>

<body>

<header>⚡ FlashBot AI (Gemini)</header>

<div id="chat">
<div class="msg bot">Halo 👋 aku FlashBot AI!</div>
</div>

<div class="bottom">
<input id="input" placeholder="Tulis pesan...">
<button onclick="send()">Kirim</button>
</div>

<script>

const chat=document.getElementById("chat");
const input=document.getElementById("input");

// 🔑 API KEY GEMINI
const API_KEY = "AIzaSyA9kXWOQR_55ec3dC4YCu5pUBSy35UDIKA";

async function send(){

const text=input.value.trim();
if(!text) return;

chat.innerHTML += `<div class="msg user">${text}</div>`;
input.value="";

chat.innerHTML += `<div class="msg bot" id="loading">✨ mengetik...</div>`;
chat.scrollTop=chat.scrollHeight;

try{

const res = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[{text:text}]
}
]
})
}
);

const data = await res.json();

document.getElementById("loading").remove();

const reply =
data.candidates?.[0]?.content?.parts?.[0]?.text
|| "Tidak ada jawaban.";

chat.innerHTML += `<div class="msg bot">${reply}</div>`;

}
catch(err){

document.getElementById("loading").remove();

chat.innerHTML += `<div class="msg bot">❌ gagal koneksi ke Gemini</div>`;

}

chat.scrollTop=chat.scrollHeight;
}

input.addEventListener("keypress",(e)=>{
if(e.key==="Enter") send();
});

</script>

</body>
</html>
